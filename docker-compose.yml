services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal_engine
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_engine"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  research:
    build:
      context: ./services/research
      dockerfile: Dockerfile
    ports: ["8000:8000"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://signal:signal@postgres:5432/signal_engine
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports: ["4000:4000"]
    command: ["sh", "-c", "pnpm --filter @signal-engine/database db:migrate && pnpm --filter @signal-engine/api start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://signal:signal@postgres:5432/signal_engine
      REDIS_URL: redis://redis:6379
      RESEARCH_SERVICE_URL: http://research:8000
      BINANCE_BASE_URL: https://fapi.binance.com
      OANDA_BASE_URL: ${OANDA_BASE_URL:-https://api-fxpractice.oanda.com}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
      OANDA_API_TOKEN: ${OANDA_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      PAPER_ROUND_TRIP_COST_BPS: ${PAPER_ROUND_TRIP_COST_BPS:-12}
      PAPER_FUNDING_BPS_PER_8H: ${PAPER_FUNDING_BPS_PER_8H:-0}
      RUN_INITIAL_BACKFILL: ${RUN_INITIAL_BACKFILL:-false}
      BACKFILL_START: ${BACKFILL_START:-}
      BACKFILL_END: ${BACKFILL_END:-}
      CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT,AVAXUSDT,LTCUSDT,DOTUSDT,TRXUSDT,TONUSDT,SUIUSDT,NEARUSDT,APTUSDT,ARBUSDT,OPUSDT,UNIUSDT,BCHUSDT}
      FOREX_SYMBOLS: ${FOREX_SYMBOLS:-EUR_USD,GBP_USD,USD_JPY,EUR_JPY,XAU_USD}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      research: { condition: service_started }
      api: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
