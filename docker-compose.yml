x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-signal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signal_engine}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile.worker
  image: signal-engine-worker:local
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  security_opt: ["no-new-privileges:true"]
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-signal_engine}
    expose: ["5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signal} -d ${POSTGRES_DB:-signal_engine}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    expose: ["6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    cpus: 0.25
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  research:
    build:
      context: ./services/research
      dockerfile: Dockerfile
    restart: unless-stopped
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: signal-engine-worker:local
    command: ["node", "packages/database/dist/migrate.js"]
    environment: *common-env
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: signal-engine-api:local
    restart: unless-stopped
    init: true
    environment:
      <<: *common-env
      API_HOST: 0.0.0.0
      API_PORT: 4400
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      SYSTEM_STALE_SECONDS: ${SYSTEM_STALE_SECONDS:-900}
      MIN_BACKTEST_TRADES: ${MIN_BACKTEST_TRADES:-30}
      MIN_OOS_TRADES: ${MIN_OOS_TRADES:-10}
    ports: ["127.0.0.1:${API_PORT:-4400}:4400"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker-ingestion:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: ingestion
      BINANCE_BASE_URL: https://fapi.binance.com
      OANDA_BASE_URL: ${OANDA_BASE_URL:-https://api-fxpractice.oanda.com}
      OANDA_API_TOKEN: ${OANDA_API_TOKEN:-}
      RUN_INITIAL_BACKFILL: ${RUN_INITIAL_BACKFILL:-false}
      BACKFILL_START: ${BACKFILL_START:-}
      BACKFILL_END: ${BACKFILL_END:-}
      BACKFILL_CHUNK_DAYS: ${BACKFILL_CHUNK_DAYS:-30}
      BACKFILL_JOBS_PER_RUN: ${BACKFILL_JOBS_PER_RUN:-2}
      BACKFILL_REQUEST_INTERVAL_MS: ${BACKFILL_REQUEST_INTERVAL_MS:-60000}
      INGEST_INTERVAL_MS: ${INGEST_INTERVAL_MS:-300000}
      CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT,AVAXUSDT,LTCUSDT,DOTUSDT,TRXUSDT,TONUSDT,SUIUSDT,NEARUSDT,APTUSDT,ARBUSDT,OPUSDT,UNIUSDT,BCHUSDT}
      FOREX_SYMBOLS: ${FOREX_SYMBOLS:-EUR_USD,GBP_USD,USD_JPY,EUR_JPY,XAU_USD}
    mem_limit: 256m
    cpus: 0.5

  worker-scanner:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: scanner
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-60000}
      MIN_BACKTEST_TRADES: ${MIN_BACKTEST_TRADES:-30}
      MIN_OOS_TRADES: ${MIN_OOS_TRADES:-10}
      CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT,AVAXUSDT,LTCUSDT,DOTUSDT,TRXUSDT,TONUSDT,SUIUSDT,NEARUSDT,APTUSDT,ARBUSDT,OPUSDT,UNIUSDT,BCHUSDT}
      FOREX_SYMBOLS: ${FOREX_SYMBOLS:-EUR_USD,GBP_USD,USD_JPY,EUR_JPY,XAU_USD}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-${TELEGRAM_CHAT_ID:-}}
    mem_limit: 256m
    cpus: 0.5

  worker-paper:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: paper
      PAPER_INTERVAL_MS: ${PAPER_INTERVAL_MS:-60000}
      PAPER_ROUND_TRIP_COST_BPS: ${PAPER_ROUND_TRIP_COST_BPS:-12}
      PAPER_FUNDING_BPS_PER_8H: ${PAPER_FUNDING_BPS_PER_8H:-0}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-${TELEGRAM_CHAT_ID:-}}
    mem_limit: 192m
    cpus: 0.25

  worker-notifications:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: notifications
      NOTIFICATION_INTERVAL_MS: ${NOTIFICATION_INTERVAL_MS:-10000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-${TELEGRAM_CHAT_ID:-}}
    mem_limit: 128m
    cpus: 0.25

  worker-backtests:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: backtests
      BACKTEST_INTERVAL_MS: ${BACKTEST_INTERVAL_MS:-30000}
      RESEARCH_SERVICE_URL: http://research:8000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      research: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5

  worker-monitor:
    <<: *worker-base
    environment:
      <<: *common-env
      WORKER_ROLE: monitor
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-60000}
      BINANCE_BASE_URL: https://fapi.binance.com
      OANDA_BASE_URL: ${OANDA_BASE_URL:-https://api-fxpractice.oanda.com}
      OANDA_API_TOKEN: ${OANDA_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-${TELEGRAM_CHAT_ID:-}}
      RETENTION_NOTIFICATION_DAYS: ${RETENTION_NOTIFICATION_DAYS:-14}
      RETENTION_ALERT_DAYS: ${RETENTION_ALERT_DAYS:-30}
    mem_limit: 128m
    cpus: 0.25

volumes:
  postgres_data:
  redis_data:
