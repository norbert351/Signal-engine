[project]
name = "signal-engine-research"
version = "0.1.0"
description = "Chronological backtesting and research workers for Signal Engine"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "pandas>=2.2,<3", "numpy>=2.1,<3"]
[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
